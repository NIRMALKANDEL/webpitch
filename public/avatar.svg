<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Illustrated avatar of Nirmal Kandel working at a laptop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B52F0"/>
      <stop offset="1" stop-color="#2236C9"/>
    </linearGradient>
    <clipPath id="c"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <!-- soft grid, a nod to layout work -->
    <g stroke="#ffffff" stroke-opacity=".08" stroke-width="2">
      <path d="M0 80h400M0 160h400M0 240h400M0 320h400M80 0v400M160 0v400M240 0v400M320 0v400"/>
    </g>
    <!-- shoulders / shirt -->
    <path d="M70 400c4-78 58-128 130-128s126 50 130 128z" fill="#0C0A09"/>
    <path d="M168 276l32 40 32-40" fill="none" stroke="#FAFAF9" stroke-width="8" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M178 232h44v46c0 12-10 20-22 20s-22-8-22-20z" fill="#B97A55"/>
    <!-- head -->
    <ellipse cx="200" cy="176" rx="62" ry="70" fill="#C98962"/>
    <!-- ears -->
    <ellipse cx="139" cy="182" rx="10" ry="16" fill="#B97A55"/>
    <ellipse cx="261" cy="182" rx="10" ry="16" fill="#B97A55"/>
    <!-- hair -->
    <path d="M136 168c-6-58 30-92 70-92 44 0 72 30 66 84-8-26-30-42-58-44-24-2-44 8-56 20-10 10-16 22-22 32z" fill="#1A1412"/>
    <!-- eyes -->
    <circle cx="178" cy="184" r="6" fill="#1A1412"/>
    <circle cx="222" cy="184" r="6" fill="#1A1412"/>
    <!-- brows -->
    <path d="M166 168q12-8 24 0M210 168q12-8 24 0" stroke="#1A1412" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M182 214q18 16 36 0" stroke="#1A1412" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- laptop -->
    <g transform="translate(200 352)">
      <rect x="-96" y="-58" width="192" height="116" rx="10" fill="#E7E5E4"/>
      <rect x="-84" y="-48" width="168" height="94" rx="4" fill="#FAFAF9"/>
      <rect x="-70" y="-36" width="70" height="10" rx="3" fill="#2F45E8"/>
      <rect x="-70" y="-18" width="120" height="6" rx="3" fill="#D6D3D1"/>
      <rect x="-70" y="-6" width="96" height="6" rx="3" fill="#D6D3D1"/>
      <rect x="-70" y="10" width="40" height="14" rx="7" fill="#0F7A3F"/>
    </g>
  </g>
</svg>
